name: Full Sync to JanusGraph

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run JanusGraph sync script
      env:
        JANUSGRAPH_URI: ${{ secrets.JANUSGRAPH_URI }}
      run: |
        echo "Starting full JanusGraph sync..."
        python scripts/sync_to_janusgraph.py --batch-size 1000
        echo "Full sync completed successfully"

    - name: Report sync status
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ JanusGraph database successfully updated with latest data"
        else
          echo "❌ JanusGraph sync failed. Please check the logs."
          exit 1
        fi
